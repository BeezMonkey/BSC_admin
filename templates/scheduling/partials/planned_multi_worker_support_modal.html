<div class="shift-modal-backdrop" data-shift-modal-backdrop>
  <section class="shift-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="shift-modal-title">
    <header class="shift-modal-header">
      <div>
        <h2 id="shift-modal-title">Review participant overlap</h2>
        <p>Confirm this only when the participant is planned to receive support from multiple workers.</p>
      </div>
      <button class="shift-modal-close" type="button" data-shift-modal-close aria-label="Close review modal">&times;</button>
    </header>
    <form class="record-form shift-modal-form js-shift-modal-form" method="post" action="{{ form_action }}" novalidate>
      {% csrf_token %}
      <input type="hidden" name="modal" value="1">
      {% if return_url %}<input type="hidden" name="next" value="{{ return_url }}">{% endif %}
      <div class="shift-modal-body">
        {% include "scheduling/partials/planned_multi_worker_support_fields.html" %}
      </div>
      <footer class="shift-modal-footer">
        <button type="button" class="button secondary" data-shift-modal-close>Cancel</button>
        <button type="submit">Approve Multi-worker Support</button>
      </footer>
    </form>
  </section>
</div>
